<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Melolo TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0f172a', red: '#e11d48', card: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes marqueeLR {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-marquee-lr {
            display: inline-block;
            animation: marqueeLR 5s linear infinite;
        }
    </style>
</head>
<body class="bg-brand-dark text-white min-h-screen flex items-center justify-center relative overflow-hidden font-sans antialiased">

    <!-- Pending Approval Overlay (TV Animation) -->
    <div id="pendingOverlay" class="fixed inset-0 z-50 bg-brand-dark/95 backdrop-blur-md hidden flex-col items-center justify-center">
        <!-- Retro TV Animation -->
        <div class="relative w-64 h-48 bg-gray-800 rounded-2xl border-8 border-gray-700 shadow-2xl flex items-center justify-center overflow-hidden mb-6">
            <!-- Antenna -->
            <div class="absolute -top-8 left-1/2 w-1 h-8 bg-gray-500 transform -translate-x-4 rotate-45"></div>
            <div class="absolute -top-8 left-1/2 w-1 h-8 bg-gray-500 transform translate-x-4 -rotate-45"></div>
            
            <!-- Screen -->
            <div class="w-52 h-36 bg-black rounded-lg relative overflow-hidden">
                <!-- Color bars (SMPTE) -->
                <div class="absolute inset-0 flex animate-pulse opacity-80">
                    <div class="flex-1 bg-gray-300"></div>
                    <div class="flex-1 bg-yellow-400"></div>
                    <div class="flex-1 bg-cyan-400"></div>
                    <div class="flex-1 bg-green-500"></div>
                    <div class="flex-1 bg-magenta-500"></div>
                    <div class="flex-1 bg-red-500"></div>
                    <div class="flex-1 bg-blue-600"></div>
                </div>
                <!-- Text on screen -->
                <div class="absolute inset-0 flex items-center justify-center bg-black/60">
                    <span class="text-white font-mono text-sm text-center px-2 animate-bounce tracking-widest">STAND BY</span>
                </div>
            </div>
            <!-- Knobs -->
            <div class="absolute right-2 top-4 w-3 h-3 rounded-full bg-gray-600"></div>
            <div class="absolute right-2 top-10 w-3 h-3 rounded-full bg-gray-600"></div>
        </div>
        
        <h2 class="text-2xl font-bold text-white mb-2 text-center">Akses Tertunda</h2>
        <p class="text-gray-400 text-center max-w-sm px-4 mb-8">Akun Anda masih dalam antrean. Silakan tunggu Admin menyetujui pendaftaran Anda sebelum dapat masuk.</p>
        
        <button onclick="document.getElementById('pendingOverlay').classList.add('hidden'); document.getElementById('pendingOverlay').classList.remove('flex');" class="px-8 py-3 bg-gray-700 text-white rounded-xl font-bold hover:bg-gray-600 transition shadow-lg">Tutup</button>
    </div>

    <!-- Dynamic Video Poster Background -->
    <div id="bgContainer" class="absolute inset-0 z-0 transition-opacity duration-1000 opacity-0">
        <img id="bgImage" src="" class="w-full h-full object-cover scale-105 blur-sm" alt="Background">
        <!-- Dark Overlay -->
        <div class="absolute inset-0 bg-gradient-to-b from-brand-dark/80 via-brand-dark/60 to-brand-dark/95"></div>
    </div>

    <!-- Login Form -->
    <div class="relative z-10 w-full max-w-md p-6">
        <div class="text-center mb-8 flex flex-col items-center">
            <!-- Logo TV LTD & Title -->
            <div class="flex items-center justify-center gap-3 mb-2">
                <div class="flex items-center justify-center bg-brand-red text-white rounded-lg p-2 shadow-lg">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                    <span class="text-xs font-black ml-1 tracking-tighter">LTD</span>
                </div>
                <h1 class="text-4xl font-black text-brand-red tracking-wider drop-shadow-lg">NINA<span class="text-white">TV</span></h1>
            </div>
            <p class="text-gray-300 drop-shadow-md">Masuk ke akun Anda</p>
        </div>

        <div class="bg-gray-900/80 backdrop-blur-xl rounded-2xl p-8 border border-gray-700/50 shadow-2xl">
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </div>
                        <input type="email" id="loginEmail" required class="w-full bg-gray-800/50 border border-gray-600 text-white rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red transition-colors" placeholder="nama@email.com">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Kata Sandi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <input type="password" id="loginPassword" required class="w-full bg-gray-800/50 border border-gray-600 text-white rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-brand-red focus:ring-1 focus:ring-brand-red transition-colors" placeholder="Masukkan kata sandi">
                    </div>
                </div>

                <button type="submit" class="w-full bg-brand-red hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-brand-red/30 mt-4">
                    Masuk
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-400">Belum punya akun? <a href="/register" class="text-brand-red hover:underline font-medium">Daftar Sekarang</a></p>
            </div>
        </div>
    </div>

    <script>
        // Fetch a random poster for the background
        async function loadBackground() {
            try {
                const response = await fetch('https://api.ferdev.my.id/internet/melolo/search?query=ceo');
                const data = await response.json();
                if (data && data.length > 0) {
                    // Get a random drama from the results
                    const randomDrama = data[Math.floor(Math.random() * Math.min(data.length, 5))];
                    let posterUrl = randomDrama.cover;
                    
                    // Handle HEIC to WEBP
                    if (posterUrl.toLowerCase().includes('.heic')) {
                        posterUrl = `https://wsrv.nl/?url=${encodeURIComponent(posterUrl)}&output=webp`;
                    }
                    
                    const bgImage = document.getElementById('bgImage');
                    bgImage.src = posterUrl;
                    bgImage.onload = () => {
                        document.getElementById('bgContainer').classList.remove('opacity-0');
                    };
                }
            } catch (error) {
                console.error('Failed to load background poster:', error);
            }
        }

        loadBackground();

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'Memproses...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();

                if (!res.ok) {
                    if (data.error && data.error.includes('menunggu persetujuan')) {
                        // Tampilkan animasi TV
                        const overlay = document.getElementById('pendingOverlay');
                        overlay.classList.remove('hidden');
                        overlay.classList.add('flex');
                    } else {
                        alert(data.error || 'Gagal masuk. Silakan coba lagi.');
                    }
                } else {
                    if (data.role === 'admin') {
                        alert('Login berhasil sebagai Admin!');
                        localStorage.setItem('melolo_user', JSON.stringify(data.user));
                        localStorage.setItem('melolo_is_admin', 'true');
                        window.location.href = '/admin';
                    } else {
                        alert('Login berhasil!');
                        // Simpan data user ke localStorage untuk ditampilkan di Profil
                        localStorage.setItem('melolo_user', JSON.stringify(data.user));
                        localStorage.removeItem('melolo_is_admin'); // Pastikan bukan admin
                        if (data.apiKey) {
                            localStorage.setItem('melolo_api_key', data.apiKey);
                            localStorage.setItem('melolo_limit', data.limit);
                            localStorage.setItem('melolo_usage', data.usage);
                        }
                        window.location.href = '/';
                    }
                }
            } catch (err) {
                alert('Terjadi kesalahan koneksi ke server.');
            } finally {
                btn.innerText = originalText;
            }
        });
    </script>
</body>
</html>
