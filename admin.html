<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Melolo TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#0f172a', red: '#e11d48', card: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes marqueeLR {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-marquee-lr {
            display: inline-block;
            animation: marqueeLR 5s linear infinite;
        }
    </style>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col md:flex-row font-sans antialiased">

    <!-- Mobile Header -->
    <div class="md:hidden bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="flex items-center justify-center bg-brand-red text-white rounded p-1 shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                <span class="text-[9px] font-black ml-0.5 tracking-tighter">LTD</span>
            </div>
            <h1 class="text-xl font-black text-brand-red tracking-wider">NINA<span class="text-white">ADMIN</span></h1>
        </div>
        <button id="mobileMenuBtn" class="text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-full md:w-64 bg-gray-900 border-r border-gray-800 flex-col hidden md:flex fixed md:sticky top-0 h-screen z-40">
        <div class="p-6 border-b border-gray-800 hidden md:block">
            <div class="flex items-center gap-2">
                <div class="flex items-center justify-center bg-brand-red text-white rounded p-1.5 shadow-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                    <span class="text-[10px] font-black ml-1 tracking-tighter">LTD</span>
                </div>
                <h1 class="text-2xl font-black text-brand-red tracking-wider">NINA<span class="text-white">ADMIN</span></h1>
            </div>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <button onclick="scrollToSection('profile')" id="nav-profile" class="w-full flex items-center gap-3 text-left px-4 py-3 rounded-lg bg-brand-red text-white font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Profil Admin
            </button>
            <button onclick="scrollToSection('password')" id="nav-password" class="w-full flex items-center gap-3 text-left px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                Ganti Sandi
            </button>
            <button onclick="scrollToSection('registrations')" id="nav-registrations" class="w-full flex items-center gap-3 text-left px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Pendaftaran User
                <span id="pendingBadge" class="ml-auto bg-brand-red text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="scrollToSection('users')" id="nav-users" class="w-full flex items-center gap-3 text-left px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white font-medium transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                User Aktif
            </button>
        </nav>
        <div class="p-4 border-t border-gray-800 space-y-2">
            <a href="/" class="flex items-center justify-center gap-2 w-full px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm font-medium transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Web
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto h-screen custom-scrollbar">
        
        <div class="max-w-6xl mx-auto space-y-8 pb-12">
            
            <!-- SECTION 1: PROFILE ADMIN -->
            <section id="section-profile">
                <h2 class="text-2xl font-bold mb-6 border-l-4 border-brand-red pl-3">Profil Admin</h2>
                <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800">
                    <div class="flex items-center gap-4">
                        <div class="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center border-2 border-brand-red">
                            <svg class="w-10 h-10 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-white">Super Admin</h3>
                            <p class="text-gray-400">admin@melolo.com</p>
                            <span class="inline-block mt-1 px-2 py-0.5 bg-green-500/20 text-green-400 border border-green-500/50 rounded text-xs font-bold uppercase">Active</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SECTION 2: GANTI SANDI -->
            <section id="section-password">
                <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800">
                    <h3 class="font-bold text-lg text-white mb-4">Ganti Kata Sandi</h3>
                    <form id="passwordForm" class="space-y-4 max-w-2xl">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Sandi Saat Ini</label>
                            <input type="password" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-brand-red" placeholder="Masukkan sandi saat ini">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Sandi Baru</label>
                            <input type="password" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-brand-red" placeholder="Masukkan sandi baru">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Konfirmasi Sandi Baru</label>
                            <input type="password" class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-brand-red" placeholder="Ulangi sandi baru">
                        </div>
                        <button type="button" onclick="alert('Kata sandi berhasil diperbarui (Simulasi)')" class="bg-brand-red hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg transition">Simpan Sandi</button>
                    </form>
                </div>
            </section>

            <!-- SECTION 3: PENDAFTARAN USER BARU -->
            <section id="section-registrations">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-bold border-l-4 border-brand-red pl-3">Pendaftaran User Baru</h2>
                    <span id="pendingBadge" class="bg-brand-red text-white text-sm font-bold px-3 py-1 rounded-full">0</span>
                </div>
                <div id="pendingUsersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Pending user cards injected via JS -->
                </div>
            </section>

            <!-- SECTION 4: DAFTAR USER AKTIF -->
            <section id="section-users">
                <h2 class="text-2xl font-bold mb-6 border-l-4 border-brand-red pl-3">Daftar User Aktif</h2>
                <div id="activeUsersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- User cards injected via JS -->
                </div>
            </section>

            <!-- LOGOUT BUTTON -->
            <div class="pt-8 border-t border-gray-800 mt-8">
                <button id="logoutBtn" class="flex items-center justify-center gap-2 w-full md:w-auto px-8 py-4 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white border border-red-500/50 rounded-xl text-lg font-bold transition mx-auto shadow-lg shadow-red-500/10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    KELUAR DARI PANEL ADMIN
                </button>
            </div>

        </div>
    </main>

    <!-- User Details Modal -->
    <div id="userModal" class="fixed inset-0 z-50 bg-brand-dark/80 backdrop-blur-sm flex items-center justify-center hidden">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative m-4">
            <button onclick="closeUserModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-3">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
                Detail User
            </h3>
            <div id="userModalContent" class="space-y-4">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script>
        // --- Authentication Check ---
        const currentUser = JSON.parse(localStorage.getItem('melolo_user'));
        const isAdmin = localStorage.getItem('melolo_is_admin') === 'true';

        if (!currentUser || !isAdmin) {
            alert('Akses Ditolak! Anda harus login sebagai Admin.');
            window.location.href = '/login';
        }

        // --- Logout Functionality ---
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if(confirm('Yakin ingin keluar dari panel admin?')) {
                localStorage.removeItem('melolo_user');
                localStorage.removeItem('melolo_is_admin');
                window.location.href = '/login';
            }
        });

        // --- State Management ---
        let pendingUsers = [];
        let activeUsers = [];

        // --- API Calls ---
        async function fetchPendingUsers() {
            try {
                const res = await fetch('/api/admin/pending');
                pendingUsers = await res.json();
                updateBadge();
                renderPendingUsers();
            } catch (e) {
                console.error('Failed to fetch pending users', e);
            }
        }

        async function fetchActiveUsers() {
            try {
                const res = await fetch('/api/admin/active');
                activeUsers = await res.json();
                renderActiveUsers();
            } catch (e) {
                console.error('Failed to fetch active users', e);
            }
        }

        // --- UI Rendering ---
        function updateBadge() {
            document.getElementById('pendingBadge').textContent = pendingUsers.length;
        }

        function renderPendingUsers() {
            const grid = document.getElementById('pendingUsersGrid');
            grid.innerHTML = '';
            
            if (pendingUsers.length === 0) {
                grid.innerHTML = `<div class="col-span-full p-8 text-center text-gray-500 bg-gray-900 rounded-2xl border border-gray-800">Tidak ada pendaftaran baru.</div>`;
                return;
            }

            pendingUsers.forEach(user => {
                const card = document.createElement('div');
                card.className = 'bg-gray-900 border border-gray-800 rounded-xl p-5 hover:border-brand-red/50 transition flex flex-col gap-4';
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div class="truncate">
                            <p class="font-bold text-white truncate">${user.name}</p>
                            <p class="text-xs text-gray-400 truncate">${user.email}</p>
                        </div>
                        <span class="text-[10px] text-gray-500 bg-gray-800 px-2 py-1 rounded whitespace-nowrap">${new Date(user.date).toLocaleDateString('id-ID')}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mt-auto">
                        <button onclick="approveUser(${user.id})" class="w-full py-2 bg-green-500/10 text-green-500 hover:bg-green-500 hover:text-white border border-green-500/30 rounded-lg text-sm font-bold transition">Setuju</button>
                        <button onclick="rejectUser(${user.id})" class="w-full py-2 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white border border-red-500/30 rounded-lg text-sm font-bold transition">Tolak</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderActiveUsers() {
            const grid = document.getElementById('activeUsersGrid');
            grid.innerHTML = '';
            
            if (activeUsers.length === 0) {
                grid.innerHTML = `<div class="col-span-full p-8 text-center text-gray-500 bg-gray-900 rounded-2xl border border-gray-800">Tidak ada user aktif.</div>`;
                return;
            }

            activeUsers.forEach(user => {
                const card = document.createElement('div');
                card.className = 'bg-gray-900 border border-gray-800 rounded-xl p-4 cursor-pointer hover:border-brand-red/50 hover:shadow-lg hover:shadow-brand-red/10 transition group flex items-center justify-between';
                card.onclick = () => openUserModal(user);
                card.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_5px_rgba(34,197,94,0.8)] flex-shrink-0"></div>
                        <div class="truncate">
                            <p class="font-bold text-white truncate group-hover:text-brand-red transition-colors">${user.name}</p>
                            <p class="text-xs text-gray-500 truncate">${user.email}</p>
                        </div>
                    </div>
                    <svg class="w-5 h-5 text-gray-600 group-hover:text-brand-red transition-colors flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                `;
                grid.appendChild(card);
            });
        }

        function openUserModal(user) {
            const modal = document.getElementById('userModal');
            const content = document.getElementById('userModalContent');
            
            content.innerHTML = `
                <div class="bg-gray-800/50 rounded-lg p-4 border border-gray-700/50">
                    <p class="text-xs text-gray-400 mb-1 uppercase tracking-wider font-bold">Nama Lengkap</p>
                    <p class="font-bold text-white text-lg">${user.name}</p>
                </div>
                <div class="bg-gray-800/50 rounded-lg p-4 border border-gray-700/50">
                    <p class="text-xs text-gray-400 mb-1 uppercase tracking-wider font-bold">Email</p>
                    <p class="font-medium text-white">${user.email}</p>
                </div>
                <div class="bg-gray-800/50 rounded-lg p-4 border border-gray-700/50">
                    <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider font-bold">API Key</p>
                    <code class="block w-full px-3 py-2 bg-gray-950 text-brand-red rounded border border-gray-800 text-sm break-all">${user.key}</code>
                </div>
                <div class="bg-gray-800/50 rounded-lg p-4 border border-gray-700/50">
                    <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider font-bold">Limit Request / Hari</p>
                    <div class="flex flex-col gap-3">
                        <input type="number" id="modal-limit-${user.id}" value="${user.limit_count}" class="w-full bg-gray-950 border border-gray-700 text-white rounded-lg px-3 py-2 focus:outline-none focus:border-brand-red">
                        <button onclick="updateLimit(${user.id})" class="w-full px-4 py-2 bg-blue-500/20 text-blue-500 hover:bg-blue-500 hover:text-white border border-blue-500/50 rounded-lg font-medium transition">Simpan Limit</button>
                    </div>
                </div>
                <div class="pt-4 border-t border-gray-800 mt-6">
                    <button onclick="deleteActiveUser(${user.id}); closeUserModal();" class="w-full px-4 py-3 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white border border-red-500/30 rounded-lg font-bold transition flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Hapus User
                    </button>
                </div>
            `;
            
            modal.classList.remove('hidden');
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        // --- Actions ---
        async function approveUser(id) {
            if(confirm('Setujui user ini dan buatkan API Key?')) {
                await fetch('/api/admin/approve', { method: 'POST', body: JSON.stringify({ userId: id }) });
                fetchPendingUsers();
                fetchActiveUsers();
            }
        }

        async function rejectUser(id) {
            if(confirm('Tolak pendaftaran user ini?')) {
                await fetch('/api/admin/reject', { method: 'POST', body: JSON.stringify({ userId: id }) });
                fetchPendingUsers();
            }
        }

        async function deletePending(id) {
            if(confirm('Hapus data pendaftaran ini dari daftar?')) {
                await fetch('/api/admin/reject', { method: 'POST', body: JSON.stringify({ userId: id }) });
                fetchPendingUsers();
            }
        }

        async function updateLimit(id) {
            const input = document.getElementById(`modal-limit-${id}`) || document.getElementById(`limit-${id}`);
            const newLimit = parseInt(input.value);
            
            if (isNaN(newLimit) || newLimit < 0) {
                alert('Limit harus berupa angka positif.');
                return;
            }

            await fetch('/api/admin/limit', { method: 'POST', body: JSON.stringify({ userId: id, limit: newLimit }) });
            alert('Limit berhasil diperbarui.');
            fetchActiveUsers();
            closeUserModal();
        }

        async function deleteActiveUser(id) {
            if(confirm('PERINGATAN: Anda yakin ingin menghapus user aktif ini? API Key mereka tidak akan bisa digunakan lagi.')) {
                await fetch('/api/admin/delete', { method: 'POST', body: JSON.stringify({ userId: id }) });
                fetchActiveUsers();
            }
        }

        // Change Password
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = e.target[0].value;
            const newPassword = e.target[1].value;
            const confirmPassword = e.target[2].value;
            
            if(newPassword !== confirmPassword) {
                alert('Konfirmasi sandi baru tidak cocok!');
                return;
            }
            
            const res = await fetch('/api/admin/password', { 
                method: 'POST', 
                body: JSON.stringify({ oldPassword, newPassword }) 
            });
            const data = await res.json();
            
            if(data.success) {
                alert('Kata sandi berhasil diperbarui!');
                e.target.reset();
            } else {
                alert(data.error || 'Gagal memperbarui kata sandi.');
            }
        });

        // --- Navigation Logic ---
        function scrollToSection(sectionId) {
            const section = document.getElementById(`section-${sectionId}`);
            if (section) {
                section.scrollIntoView({ behavior: 'smooth' });
            }
            
            // Update active state
            const navIds = ['profile', 'password', 'registrations', 'users'];
            navIds.forEach(id => {
                const btn = document.getElementById(`nav-${id}`);
                if (btn) {
                    if (id === sectionId) {
                        btn.classList.remove('text-gray-400', 'hover:bg-gray-800', 'hover:text-white');
                        btn.classList.add('bg-brand-red', 'text-white');
                    } else {
                        btn.classList.remove('bg-brand-red', 'text-white');
                        btn.classList.add('text-gray-400', 'hover:bg-gray-800', 'hover:text-white');
                    }
                }
            });

            // Close mobile menu if open
            const sidebar = document.getElementById('sidebar');
            if(window.innerWidth < 768) {
                sidebar.classList.add('hidden');
            }
        }

        // Mobile Menu Toggle
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        });

        // Initialize
        fetchPendingUsers();
        fetchActiveUsers();

    </script>
</body>
</html>
